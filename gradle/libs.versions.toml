#
# OmniDeck — single source of dependency truth (architecture.md §17).
#
# RULE: no module may declare a dependency coordinate or version outside this file.
#       The `omnideck.quality` convention plugin fails the build on violations.
#
# Versions are pinned deliberately. Renovate raises update PRs; CI gates them.
# See docs/adr/0008-monorepo-convention-plugins.md
#
[versions]
# --- Toolchain ---------------------------------------------------------------
jdk                      = "21"
agp                      = "8.12.0"
kotlin                   = "2.2.0"
ksp                      = "2.2.0-2.0.2"
compileSdk               = "36"
targetSdk                = "36"
minSdk                   = "26"          # ADR decision D-3

# --- AndroidX core -----------------------------------------------------------
androidxCore             = "1.16.0"
androidxActivity         = "1.10.1"
androidxLifecycle        = "2.9.2"
androidxNavigation       = "2.9.3"
androidxDataStore        = "1.1.7"
androidxStartup          = "1.2.0"
androidxSecurityBiometric = "1.1.0"
androidxWork             = "2.10.2"
androidxRoom             = "2.7.2"
androidxProfileinstaller = "1.4.1"
androidxCoreSplashscreen = "1.0.1"
androidxTestCore         = "1.6.1"
androidxTestRunner       = "1.6.2"
androidxTestJunit        = "1.2.1"
androidxEspresso         = "3.6.1"
androidxBenchmark        = "1.3.4"
uiautomator              = "2.3.0"

# --- Compose -----------------------------------------------------------------
composeBom               = "2025.08.00"
composeAdaptive          = "1.1.0"

# --- Kotlin ecosystem --------------------------------------------------------
coroutines               = "1.10.2"
serialization            = "1.9.0"
kotlinxDatetime          = "0.6.2"
kotlinxImmutable         = "0.4.0"

# --- DI ----------------------------------------------------------------------
hilt                     = "2.57"
hiltNavigationCompose    = "1.2.0"
hiltWork                 = "1.2.0"

# --- Network -----------------------------------------------------------------
okhttp                   = "4.12.0"
retrofit                 = "2.11.0"
retrofitSerialization    = "1.0.0"

# --- Play --------------------------------------------------------------------
playFeatureDelivery      = "2.1.0"
playAppUpdate            = "2.1.0"
playReview               = "2.0.2"
playIntegrity            = "1.4.0"
playBilling              = "7.1.1"

# --- Crypto ------------------------------------------------------------------
tink                     = "1.16.0"

# --- Images ------------------------------------------------------------------
coil                     = "2.7.0"

# --- Testing -----------------------------------------------------------------
junit4                   = "4.13.2"
junit5                   = "5.11.4"
turbine                  = "1.2.1"
mockk                    = "1.14.5"
truth                    = "1.4.4"
robolectric              = "4.14.1"
roborazzi                = "1.44.0"

# --- Quality -----------------------------------------------------------------
detekt                   = "1.23.8"
spotless                 = "7.0.4"
ktlint                   = "1.5.0"
kover                    = "0.9.1"
bcv                      = "0.18.1"
dependencyCheck          = "12.1.0"
cyclonedx                = "1.10.0"
# Android Lint's own versioning: AGP X.Y.Z ships Lint (X+23).Y.Z (OD-009).
lint                     = "31.12.0"

[libraries]
# --- Build-logic classpath (used by build-logic/convention) ------------------
android-gradlePlugin     = { module = "com.android.tools.build:gradle",                       version.ref = "agp" }
kotlin-gradlePlugin      = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin",            version.ref = "kotlin" }
kotlin-composePlugin     = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin",  version.ref = "kotlin" }
ksp-gradlePlugin         = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
detekt-gradlePlugin      = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin",     version.ref = "detekt" }
kover-gradlePlugin       = { module = "org.jetbrains.kotlinx:kover-gradle-plugin",            version.ref = "kover" }

# --- AndroidX ----------------------------------------------------------------
androidx-core-ktx        = { module = "androidx.core:core-ktx",                     version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose",        version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx     = { module = "androidx.lifecycle:lifecycle-runtime-ktx",     version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose",  version.ref = "androidxNavigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDataStore" }
androidx-datastore-core  = { module = "androidx.datastore:datastore",               version.ref = "androidxDataStore" }
androidx-startup         = { module = "androidx.startup:startup-runtime",           version.ref = "androidxStartup" }
androidx-biometric       = { module = "androidx.biometric:biometric-ktx",           version.ref = "androidxSecurityBiometric" }
androidx-work-runtime    = { module = "androidx.work:work-runtime-ktx",             version.ref = "androidxWork" }
androidx-work-testing    = { module = "androidx.work:work-testing",                 version.ref = "androidxWork" }
androidx-room-runtime    = { module = "androidx.room:room-runtime",                 version.ref = "androidxRoom" }
androidx-room-ktx        = { module = "androidx.room:room-ktx",                     version.ref = "androidxRoom" }
androidx-room-compiler   = { module = "androidx.room:room-compiler",                version.ref = "androidxRoom" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen",           version.ref = "androidxCoreSplashscreen" }

# --- Compose (versions come from the BOM) ------------------------------------
compose-bom              = { module = "androidx.compose:compose-bom",               version.ref = "composeBom" }
compose-ui               = { module = "androidx.compose.ui:ui" }
compose-ui-graphics      = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4   = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3        = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "composeAdaptive" }
compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "composeAdaptive" }
compose-material3-windowsize = { module = "androidx.compose.material3:material3-window-size-class" }

# --- Kotlin ------------------------------------------------------------------
kotlinx-coroutines-core  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime         = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinxDatetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }

# --- DI ----------------------------------------------------------------------
hilt-android             = { module = "com.google.dagger:hilt-android",             version.ref = "hilt" }
hilt-compiler            = { module = "com.google.dagger:hilt-android-compiler",    version.ref = "hilt" }
hilt-navigation-compose  = { module = "androidx.hilt:hilt-navigation-compose",      version.ref = "hiltNavigationCompose" }
hilt-work                = { module = "androidx.hilt:hilt-work",                    version.ref = "hiltWork" }
hilt-testing             = { module = "com.google.dagger:hilt-android-testing",     version.ref = "hilt" }

# --- Network -----------------------------------------------------------------
okhttp                   = { module = "com.squareup.okhttp3:okhttp",                version.ref = "okhttp" }
okhttp-logging           = { module = "com.squareup.okhttp3:logging-interceptor",   version.ref = "okhttp" }
okhttp-mockwebserver     = { module = "com.squareup.okhttp3:mockwebserver",         version.ref = "okhttp" }
retrofit                 = { module = "com.squareup.retrofit2:retrofit",            version.ref = "retrofit" }
retrofit-serialization   = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }

# --- Play --------------------------------------------------------------------
play-feature-delivery    = { module = "com.google.android.play:feature-delivery-ktx", version.ref = "playFeatureDelivery" }
play-app-update          = { module = "com.google.android.play:app-update-ktx",      version.ref = "playAppUpdate" }
play-review              = { module = "com.google.android.play:review-ktx",          version.ref = "playReview" }
play-integrity           = { module = "com.google.android.play:integrity",           version.ref = "playIntegrity" }
play-billing             = { module = "com.android.billingclient:billing-ktx",       version.ref = "playBilling" }

# --- Crypto ------------------------------------------------------------------
tink-android             = { module = "com.google.crypto.tink:tink-android",         version.ref = "tink" }

# --- Images ------------------------------------------------------------------
coil-compose             = { module = "io.coil-kt:coil-compose",                     version.ref = "coil" }

# --- Testing -----------------------------------------------------------------
junit4                   = { module = "junit:junit",                                 version.ref = "junit4" }
junit5-api               = { module = "org.junit.jupiter:junit-jupiter-api",          version.ref = "junit5" }
junit5-engine            = { module = "org.junit.jupiter:junit-jupiter-engine",       version.ref = "junit5" }
junit5-params            = { module = "org.junit.jupiter:junit-jupiter-params",       version.ref = "junit5" }
turbine                  = { module = "app.cash.turbine:turbine",                     version.ref = "turbine" }
mockk                    = { module = "io.mockk:mockk",                               version.ref = "mockk" }
mockk-android            = { module = "io.mockk:mockk-android",                       version.ref = "mockk" }
truth                    = { module = "com.google.truth:truth",                       version.ref = "truth" }
robolectric              = { module = "org.robolectric:robolectric",                  version.ref = "robolectric" }
roborazzi                = { module = "io.github.takahirom.roborazzi:roborazzi",      version.ref = "roborazzi" }
roborazzi-compose        = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule     = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-core       = { module = "androidx.test:core-ktx",                       version.ref = "androidxTestCore" }
androidx-test-runner     = { module = "androidx.test:runner",                         version.ref = "androidxTestRunner" }
androidx-test-junit      = { module = "androidx.test.ext:junit-ktx",                  version.ref = "androidxTestJunit" }
androidx-espresso-core   = { module = "androidx.test.espresso:espresso-core",         version.ref = "androidxEspresso" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4",    version.ref = "androidxBenchmark" }
androidx-uiautomator      = { module = "androidx.test.uiautomator:uiautomator",        version.ref = "uiautomator" }

# --- KSP (tools/module-processor, OD-202) -------------------------------------
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# --- Lint (tools/lint-rules, OD-009) ------------------------------------------
lint-api                 = { module = "com.android.tools.lint:lint-api",              version.ref = "lint" }
lint-checks              = { module = "com.android.tools.lint:lint-checks",          version.ref = "lint" }
lint-tests               = { module = "com.android.tools.lint:lint-tests",           version.ref = "lint" }

[plugins]
android-application      = { id = "com.android.application",                          version.ref = "agp" }
android-library          = { id = "com.android.library",                              version.ref = "agp" }
android-dynamic-feature  = { id = "com.android.dynamic-feature",                      version.ref = "agp" }
android-test             = { id = "com.android.test",                                 version.ref = "agp" }
baselineprofile          = { id = "androidx.baselineprofile",                          version.ref = "androidxBenchmark" }
kotlin-android           = { id = "org.jetbrains.kotlin.android",                      version.ref = "kotlin" }
kotlin-jvm               = { id = "org.jetbrains.kotlin.jvm",                          version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose",               version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization",         version.ref = "kotlin" }
ksp                      = { id = "com.google.devtools.ksp",                           version.ref = "ksp" }
hilt                     = { id = "com.google.dagger.hilt.android",                    version.ref = "hilt" }
room                     = { id = "androidx.room",                                     version.ref = "androidxRoom" }
detekt                   = { id = "io.gitlab.arturbosch.detekt",                        version.ref = "detekt" }
spotless                 = { id = "com.diffplug.spotless",                              version.ref = "spotless" }
kover                    = { id = "org.jetbrains.kotlinx.kover",                        version.ref = "kover" }
roborazzi                = { id = "io.github.takahirom.roborazzi",                       version.ref = "roborazzi" }
binary-compatibility     = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
dependency-check         = { id = "org.owasp.dependencycheck",                          version.ref = "dependencyCheck" }
cyclonedx                = { id = "org.cyclonedx.bom",                                  version.ref = "cyclonedx" }
