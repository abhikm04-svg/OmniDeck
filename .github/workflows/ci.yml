name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Any Kotlin/Java warning becomes an error locally; keep CI in sync (Extensions.kt).
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    # Roborazzi renders every shared component under Robolectric, which is slow on a
    # cold runner. 30 minutes cancelled the job mid-screenshot-diff.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Robolectric downloads an android-all jar per SDK level on first use, which is
      # most of the screenshot step's cold-start cost. Cached separately from the
      # Gradle cache because it lives in ~/.m2, which setup-gradle does not manage.
      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Quality gate (Detekt, Spotless, architecture fitness function)
        run: ./gradlew qualityCheck --stacktrace

      # SDK ABI must match the checked-in .api dump (ADR-004). A public-API change
      # without a regenerated dump in the same commit fails here, by design.
      - name: SDK binary compatibility
        run: ./gradlew apiCheck --stacktrace

      # Includes the plug-and-play fitness test (OD-212) and the Shell-isolation one:
      # the Phase 2 exit gate — "adding a module changes no Shell file" — is checked
      # mechanically here, rather than by someone reading a PR diff.
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # Android Lint, including the custom OmniDeck rules from :tools:lint-rules
      # (OD-009). Runs both variants; lintVitalRelease is the release-blocking pass.
      - name: Android Lint
        run: ./gradlew lint --stacktrace

      # OD-113. Re-renders every shared component and diffs it against the committed
      # baselines. A contrast or layout regression in the design system reaches every
      # module at once and no module's own tests would catch it, so this is the only
      # thing standing between such a change and all of them.
      #
      # Note: Roborazzi records inside the ordinary test task, so a plain unit-test
      # failure in that module blocks capture entirely. A run reporting *missing*
      # baselines rather than a diff usually means an ordinary test failed first.
      - name: Screenshot diff
        run: ./gradlew verifyRoborazziDebug --stacktrace

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/**'
          retention-days: 14

      # Blocking from the Phase 1 exit gate: platform:* must hold >= 80% line
      # coverage. Projects with no test source set report without failing, so a
      # module's first build is never red for coverage it never claimed to have.
      #
      # Reports and gate run in ONE invocation, deliberately. Split across two, the
      # same commit produced a passing koverVerify alongside a report.xml showing
      # 75.8% against the 80% floor, with koverXmlReport and koverHtmlReport
      # disagreeing with each other — every task executing fresh, no cache hits.
      - name: Coverage report and verification
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify --stacktrace

      # Independent cross-check of the artifact humans actually read, against the
      # same floors in gradle.properties. koverVerify's verdict and the published
      # number are not the same thing — this fails the build when they diverge,
      # instead of the divergence passing silently as it did three runs running.
      - name: Assert published coverage matches the floors
        run: python3 scripts/verify-coverage.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/detekt/
            **/build/reports/kover/
            **/build/reports/lint-results-*.html
            **/build/test-results/
          retention-days: 14

  # Informational only — nothing here fails the build. Its own job for two reasons:
  # it is a Docker action, so it builds a container before it runs anything, and the
  # count is worth reading on its own rather than buried in a 60-minute build log.
  #
  # Pinned to the commit behind tag 6. A third-party action on a mutable tag runs
  # whatever that tag points at today inside our runner; the workflow-level
  # `contents: read` limits the blast radius but does not remove it.
  #
  # The exclusions matter more than they look: app/src/main/baseline-prof.txt is a
  # generated 48,000-line ART profile, and counted as source it is roughly five times
  # the size of everything a human wrote here.
  cloc:
    name: Count lines of code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Count Lines of Code (cloc)
        uses: djdefi/cloc-action@d4a7e15e4ff5219692f79ba71685af08955dcfc0 # 6
        with:
          options: --exclude-dir=build,.gradle,.kotlin --not-match-f=.*-prof\.txt$ --md

  # The Phase 0 exit gate: a module that reaches across a layering boundary must
  # fail CI, not merely get flagged in review. Kept as its own job so the signal
  # is unmistakable in the checks list.
  architecture-fitness:
    name: Architecture fitness function
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: checkArchitecture across all modules
        run: ./gradlew checkArchitecture --stacktrace

  # The Phase 3 exit gate: on-demand delivery is a *deployment* decision (ADR-001), so
  # flipping every module onto a Play feature split must need no source change at all.
  # Asserting that in prose lasts until the first module quietly grows a dependency
  # that only resolves when it is bundled, so it is built here on every run instead.
  #
  # Release rather than debug on purpose. The whole reason `omnideck.module` generates
  # an R8 keep rule is that a split's entry point is loaded reflectively, and losing it
  # fails **in release builds only** — the one failure mode in this architecture that a
  # debug build cannot see. `bundleRelease` also packages the actual splits, which is
  # what catches a descriptor left in a split instead of the base.
  on-demand-delivery:
    name: On-demand delivery (OD-301)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Discover modules
        id: modules
        run: |
          modules=$(find modules -mindepth 2 -maxdepth 2 -name build.gradle.kts -printf '%h\n' \
            | xargs -r -n1 basename | sort | paste -sd, -)
          echo "list=$modules" >> "$GITHUB_OUTPUT"
          echo "Delivering on demand: ${modules:-<none>}"

      # The module list comes from directory names in the checked-out branch, so it is
      # attacker-controllable on a fork PR. Passed through the environment and quoted
      # rather than interpolated into the command line, where a directory named with
      # shell metacharacters would execute inside the runner.
      - name: Build every module as a Play feature split
        if: steps.modules.outputs.list != ''
        env:
          OMNIDECK_DYNAMIC_MODULES: ${{ steps.modules.outputs.list }}
        run: ./gradlew :app:bundleRelease "-Pomnideck.dynamicModules=$OMNIDECK_DYNAMIC_MODULES" --stacktrace

      # OD-312. Checked here rather than in the main build because this job is the
      # only one that produces a bundle in the shape that ships — every module a
      # split, which is what the per-split budget is about. §16's budgets only work
      # if they start at zero, and this one does.
      - name: App size budgets
        if: steps.modules.outputs.list != ''
        run: python3 scripts/check-app-size.py

      # The fitness tests have to mean something in this mode too: the registry now
      # covers no module, the descriptors still cover all of them, and no Shell source
      # may name one. Layering is re-checked because a split's dependency on the base
      # APK is the one edge AGP adds that the rules cannot forbid.
      - name: Fitness functions hold in on-demand mode
        if: steps.modules.outputs.list != ''
        env:
          OMNIDECK_DYNAMIC_MODULES: ${{ steps.modules.outputs.list }}
        run: |
          ./gradlew :app:testDebugUnitTest checkArchitecture \
            "-Pomnideck.dynamicModules=$OMNIDECK_DYNAMIC_MODULES" --stacktrace

      # Deliberately in the workspace the two steps above just built on demand, with
      # no property and no clean. ADR-001 claims delivery is a switch, and a switch
      # that only works one way in a fresh checkout is not one: the generated
      # descriptor changes content with the mode, so anything that keeps a stale copy
      # of it produces a base APK advertising modules it does not carry, or a bundle
      # with the same asset in two modules. Both were real, and neither is visible in
      # a build that only ever ran in one mode.
      - name: The switch goes back
        if: steps.modules.outputs.list != ''
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-demand-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  # OD-317/OD-318/OD-303/OD-307. Every `connected*AndroidTest` task above this line
  # runs nowhere in CI, because there has never been a device to run it on — that gap
  # is what carried those four tickets out of Phase 2 and then out of Phase 3. A
  # Gradle Managed Device closes it: AGP owns the whole lifecycle (image, boot,
  # install, teardown) from a device definition in source control
  # (`configureManagedDevices`, Extensions.kt), so there is no physical unit's OEM
  # install policy or broadcast policy to fight — the two failure modes that blocked
  # this on the HyperOS reference phone (see CLAUDE.md, "What is not verified here").
  #
  # `pixel6Api34` is the reference device (OD-317: `architecture.md` QA-1..QA-3 name
  # a physical "Pixel 6a", for which no GMD system image exists; a Pixel 6 profile at
  # API 34 is the closest published pairing, and it is what every budget in this repo
  # is recorded against from here on). `apiFloorPixel2` is `minSdk` itself (API 26,
  # ADR decision D-3) — the low end of OD-303's sweep.
  on-device:
    name: On-device (Gradle Managed Device)
    runs-on: ubuntu-latest
    # First run downloads a system image per device (~1-2 GB); GMDs are supported on
    # GitHub's hosted Linux runners because /dev/kvm is available there, unlike most
    # self-hosted or containerized CI, where this job would need to be skipped.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # KVM is present on GitHub-hosted Linux runners but not group-readable by the
      # runner user out of the box; without this the emulator falls back to software
      # rendering and a boot that takes seconds takes minutes, if it does not exceed
      # the job timeout first.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android Virtual Devices
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: gmd-avd-${{ runner.os }}-${{ hashFiles('build-logic/convention/src/main/kotlin/com/omnideck/build/Extensions.kt') }}

      # OD-316 (persistence survives process death) and the device half of OD-212
      # (plug-and-play) for the Shell; SecureStoreImpl's Keystore-backed tests for the
      # kernel, which have no JVM/Robolectric equivalent (CLAUDE.md, "Commands").
      - name: Kernel + Shell connected tests, reference device
        run: |
          ./gradlew :platform:kernel:pixel6Api34DebugAndroidTest \
            :app:pixel6Api34DebugAndroidTest --stacktrace

      # OD-303 — the API 26->36 sweep this ticket actually asks for, not just a
      # reading at one API level. Kept as its own step so a floor-only failure is
      # legible in the CI log rather than folded into the step above.
      - name: API-floor sweep (OD-303)
        run: ./gradlew :platform:kernel:apiFloorPixel2DebugAndroidTest --stacktrace

      # OD-304/OD-307's release-shape half: minified, shrunk, non-debuggable, signed
      # with the debug key so it installs without release credentials (see :app's
      # convention plugin for why `benchmark` — not `release` — is the vehicle). This
      # is what a `ClassNotFoundException` from a missing R8 keep rule can only show
      # up in, and what a deferred-uninstall/purge fan-out needs a real install
      # session for.
      - name: Release-shape module loading (OD-304/OD-307)
        run: |
          ./gradlew :app:pixel6Api34DebugAndroidTest \
            -Pomnideck.testBuildType=benchmark --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: on-device-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14
