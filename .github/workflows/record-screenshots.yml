name: Record screenshots

# Screenshot baselines are platform-specific. Font rasterisation and anti-aliasing
# differ between operating systems, so a baseline recorded on a Windows or macOS
# developer machine will never match a Linux CI runner — every capture fails with an
# AssertionError that looks like a regression but is not one.
#
# So baselines are recorded *here*, on the same image CI verifies against, and the
# result is committed. Run this whenever a deliberate visual change lands, then
# download the artifact and commit its contents over src/test/screenshots.
#
#   gh workflow run "Record screenshots"
#   gh run download <run-id> -n screenshots -D platform/design-system/src/test/screenshots
#
# Manual on purpose: re-recording is how a real regression gets rubber-stamped, so it
# should be a deliberate act with a diff to review, never an automatic step.
on:
  workflow_dispatch:
  # Pushing a branch under record-screenshots/** records a fresh set. This exists
  # because workflow_dispatch is only offered for workflows already on the default
  # branch, which is no help the first time — and no help to a contributor on a fork.
  push:
    branches:
      - "record-screenshots/**"

permissions:
  contents: read

jobs:
  record:
    name: Record baselines on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Record
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload baselines
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: platform/design-system/src/test/screenshots/*.png
          retention-days: 14
          if-no-files-found: error
