name: Feature request
description: Propose new functionality for the Shell, kernel, or a module.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't a user or module author do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: contract-impact
    attributes:
      label: Does this touch the SDK contract (platform/omnideck-sdk*)?
      options:
        - "No"
        - "Yes — needs an ADR"
        - "Unsure"
    validations:
      required: true
