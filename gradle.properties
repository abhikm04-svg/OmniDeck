# ---------------------------------------------------------------------------
# JVM / Gradle daemon
#
# preferIPv4Stack: on dual-stack networks that advertise IPv6 but cannot route
# it, Gradle's downloads hang until the 10s socket timeout and then fail. Forcing
# IPv4 avoids a first-run failure that looks like "Gradle is broken".
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.configureondemand=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
ksp.useKSP2=true

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
# Fail the build if a library ships a resource that collides across modules.
android.uniquePackageNames=true

# OD-303/OD-317. `apiFloorPixel2` (Extensions.kt, configureManagedDevices) targets
# API 26 deliberately — that is `minSdk` (ADR decision D-3), and the point of the
# 26->36 sweep is the floor itself, not the nearest API a Gradle Managed Device
# supports without asking. AGP's warning about "not recommended" is about image
# staleness (API 26 no longer receives security patches), which does not apply here:
# nothing this device runs talks to a network the device itself has to secure.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true

# ---------------------------------------------------------------------------
# OmniDeck build switches
# ---------------------------------------------------------------------------
# Coverage floors enforced by omnideck.quality (implementation_plan.md §17).
omnideck.coverage.platform.min=80
omnideck.coverage.module.min=70
# Base APK download budget in MB (architecture.md §16).
omnideck.size.baseApkMaxMb=25
# Per-feature-split budget in MB.
omnideck.size.splitMaxMb=8

# ---------------------------------------------------------------------------
# Per-project coverage exclusions (omnideck.quality).
#
# Keyed by project path with ':' replaced by '.', comma-separated. Read at
# configuration time, before any project is evaluated — deliberately not a block in
# the project's own build file, because both shapes of that tried before applied to
# the report and not to koverVerify, or applied on a developer machine and not on CI.
#
# Narrow and justified, never broad. Each entry earns its place below.
# ---------------------------------------------------------------------------

# There is deliberately NO exclusion for :platform:kernel. SecureStoreImpl talks to
# the Android Keystore, which has no JVM provider and is not implemented by
# Robolectric, so its ~55 lines can never be covered by a unit test — but excluding
# them turned out to cost more than counting them. The filter applied to koverVerify
# and not to koverXmlReport on Linux, in three different pattern shapes, and a gate
# that cannot be reconciled with its own published report is worth less than the five
# points it was buying. The kernel now clears the floor at 680/843 = 80.7% with those
# lines counted against it, which is the more conservative measure anyway.
#
# SecureStoreImpl is verified where it can actually run:
#   ./gradlew :platform:kernel:connectedDebugAndroidTest

# Kover does not credit code run through Compose's runtime under Robolectric. The
# evidence is unambiguous: plain property initializers in Tokens.kt report 0% despite
# every screenshot depending on them, while the module's ordinary Kotlin (TileState,
# WindowWidthClass, Spacing) reports 100% from the same test run. Excluded by
# annotation rather than by file, so the pure functions that share a file with a
# composable — the adaptive layout rules — stay measured. What actually verifies this
# code is the screenshot gate:
#   ./gradlew :platform:design-system:verifyRoborazziDebug
omnideck.coverage.excludeAnnotatedBy.platform.design-system=androidx.compose.runtime.Composable

# Same reason as design-system, in a module rather than the platform: Kover does not
# credit @Composable code run through Compose's runtime under Robolectric, and Notes'
# two screens would otherwise drag the module below its 70% floor while its logic —
# repository, outbox adapter, sync transport, both ViewModels — is covered at well
# above it. The screens are verified by the design system's screenshot gate for the
# shared components they are built from, and by the instrumented plug-and-play test
# (OD-212) for the fact that they render at all.
omnideck.coverage.excludeAnnotatedBy.modules.notes=androidx.compose.runtime.Composable
