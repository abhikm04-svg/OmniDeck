# ---------------------------------------------------------------------------
# JVM / Gradle daemon
#
# preferIPv4Stack: on dual-stack networks that advertise IPv6 but cannot route
# it, Gradle's downloads hang until the 10s socket timeout and then fail. Forcing
# IPv4 avoids a first-run failure that looks like "Gradle is broken".
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.configureondemand=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
ksp.useKSP2=true

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
# Fail the build if a library ships a resource that collides across modules.
android.uniquePackageNames=true

# ---------------------------------------------------------------------------
# OmniDeck build switches
# ---------------------------------------------------------------------------
# Coverage floors enforced by omnideck.quality (implementation_plan.md §17).
omnideck.coverage.platform.min=80
omnideck.coverage.module.min=70
# Base APK download budget in MB (architecture.md §16).
omnideck.size.baseApkMaxMb=25
# Per-feature-split budget in MB.
omnideck.size.splitMaxMb=8
