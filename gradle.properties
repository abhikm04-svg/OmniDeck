# ---------------------------------------------------------------------------
# JVM / Gradle daemon
#
# preferIPv4Stack: on dual-stack networks that advertise IPv6 but cannot route
# it, Gradle's downloads hang until the 10s socket timeout and then fail. Forcing
# IPv4 avoids a first-run failure that looks like "Gradle is broken".
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.configureondemand=false

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g
ksp.useKSP2=true

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
# Fail the build if a library ships a resource that collides across modules.
android.uniquePackageNames=true

# ---------------------------------------------------------------------------
# OmniDeck build switches
# ---------------------------------------------------------------------------
# Coverage floors enforced by omnideck.quality (implementation_plan.md §17).
omnideck.coverage.platform.min=80
omnideck.coverage.module.min=70
# Base APK download budget in MB (architecture.md §16).
omnideck.size.baseApkMaxMb=25
# Per-feature-split budget in MB.
omnideck.size.splitMaxMb=8

# ---------------------------------------------------------------------------
# Per-project coverage exclusions (omnideck.quality).
#
# Keyed by project path with ':' replaced by '.', comma-separated. Read at
# configuration time, before any project is evaluated — deliberately not a block in
# the project's own build file, because both shapes of that tried before applied to
# the report and not to koverVerify, or applied on a developer machine and not on CI.
#
# Narrow and justified, never broad. Each entry earns its place below.
# ---------------------------------------------------------------------------

# SecureStoreImpl talks to the Android Keystore, which has no JVM provider and is not
# implemented by Robolectric: its crypto cannot execute in a unit test at all. It IS
# tested — platform/kernel/src/androidTest/.../SecureStoreImplTest.kt covers the
# encrypt/decrypt round trip, per-module key isolation, alias sanitisation and the
# absence of plaintext on disk — but instrumented runs need a device, so Kover never
# sees that coverage. Run the real thing with:
#   ./gradlew :platform:kernel:connectedDebugAndroidTest
# The trailing wildcard is load-bearing twice over. Each suspend function compiles to
# its own SecureStoreImpl$put$2 continuation class, so an exact name leaves four of
# them counted as uncovered. And an exact name is precisely what Kover's XML report
# ignored on Linux while honouring it in koverVerify: every pattern that has ever
# worked on both contains a '*', and none of the ones that failed did. One trailing
# wildcard covers the class and all four continuations without relying on '$'.
omnideck.coverage.excludeClasses.platform.kernel=com.omnideck.kernel.services.SecureStoreImpl*

# Kover does not credit code run through Compose's runtime under Robolectric. The
# evidence is unambiguous: plain property initializers in Tokens.kt report 0% despite
# every screenshot depending on them, while the module's ordinary Kotlin (TileState,
# WindowWidthClass, Spacing) reports 100% from the same test run. Excluded by
# annotation rather than by file, so the pure functions that share a file with a
# composable — the adaptive layout rules — stay measured. What actually verifies this
# code is the screenshot gate:
#   ./gradlew :platform:design-system:verifyRoborazziDebug
omnideck.coverage.excludeAnnotatedBy.platform.design-system=androidx.compose.runtime.Composable
