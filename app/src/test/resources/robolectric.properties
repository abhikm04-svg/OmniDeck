# Robolectric 4.14.1 ships shadows up to API 35, and the Shell targets 36. Without
# this the runner refuses to start with "targetSdkVersion=36 > maxSdkVersion=35" —
# an initialisation error rather than a test failure, so every Robolectric test in
# :app disappears from the report instead of going red.
#
# Pinned here rather than annotated per class so a new test cannot silently
# reintroduce it. Remove when Robolectric supports 36. The platform library modules
# need no equivalent: a library declares no targetSdk.
sdk=35

# A plain Application, not OmniDeckApplication. The real one is @HiltAndroidApp and
# initialises WorkManager in onCreate, so Robolectric builds the whole production
# object graph — and a background scheduler — before any assertion runs. These tests
# are about discovery, the generated registry and route mapping, none of which need
# it; an instrumented test is where the real Application belongs.
application=android.app.Application
